<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>YOLO Game UI Labeler</title>
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
         background:#1e1e1e; color:#e0e0e0; font-family:sans-serif; }
  .loader { text-align:center; }
  .spinner { width:40px; height:40px; border:3px solid #404040; border-top-color:#4a9eff;
             border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 16px; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="loader">
  <div class="spinner"></div>
  <p>正在启动...</p>
</div>
</body>
</html>
